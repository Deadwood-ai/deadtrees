<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exclusion benchmark labels</title>
<link rel="stylesheet" href="/label.css">
</head>
<body>
<header>
  <button id="prev" title="Previous dataset (p)">←</button>
  <span id="position"></span>
  <button id="next" title="Next dataset (n)">→</button>
  <span id="check"></span>
  <span id="meta"></span>
  <a id="site" target="_blank" rel="noopener noreferrer">Open on deadtrees.earth</a>
  <span id="progress"></span>
  <select id="filter">
    <option value="adjudicate">To adjudicate</option>
    <option value="all">All datasets</option>
    <option value="todo">Not finished</option>
    <option value="done">Finished</option>
  </select>
</header>
<main>
  <section id="viewer">
    <div id="stage"><div id="layers"></div>
      <div id="popover" hidden>
        <div class="title"></div>
        <div class="sol-only"><span class="chip" data-value="right">Right</span><span class="chip" data-value="wrong">Wrong</span> <button class="clear">Clear</button></div>
        <div class="user-only">
          <select name="layer"><option value="deadwood">Deadwood</option><option value="forest_cover">Forest</option></select>
          <select name="kind"><option value="missed_by_sol">Error Sol missed</option><option value="real_error">Real error (example)</option><option value="correct_prediction">Correct prediction (example)</option><option value="not_a_tree">Not a standing tree</option><option value="note">Note</option></select>
        </div>
        <input name="note" placeholder="Note, e.g. lying logs, not standing" maxlength="300">
        <div class="actions"><button class="save">Save</button><button class="delete">Delete</button><button class="cancel">Cancel</button></div>
      </div>
    </div>
    <div id="controls">
      <label><input type="checkbox" id="show-deadwood" checked> Deadwood <kbd>d</kbd></label>
      <label><input type="checkbox" id="show-forest_cover"> Forest <kbd>f</kbd></label>
      <label><input type="checkbox" id="outline"> Outline only <kbd>o</kbd></label>
      <label><input type="checkbox" id="show-marks" checked> Boxes <kbd>b</kbd></label>
      <label><input type="checkbox" id="show-seams" checked> Tile seams <kbd>s</kbd></label>
      <span class="hint-inline">Click a box to judge it · Shift-drag to draw your own</span>
      <label>Opacity <input type="range" id="opacity" min="0" max="100" value="55"></label>
      <button id="fit" title="Fit (0)">Fit</button>
      <span id="view-info"></span>
    </div>
    <div id="thumbs"></div>
  </section>
  <aside id="form">
    <details id="audit" open><summary>Original audit</summary><dl id="audit-body"></dl></details>
    <details id="sol" open><summary>Sol (<span id="sol-run">best run</span>)</summary><dl id="sol-body"></dl></details>
    <p class="hint">Exclude a layer when roughly more than 20% of the dataset area has unacceptable predictions. Unsure is fine.</p>
    <div class="layer" data-layer="deadwood">
      <h2>Deadwood <small>keys 1 / 2 / 3</small></h2>
      <div class="verdicts"></div>
      <div class="areas"></div>
      <div class="tags"></div>
    </div>
    <div class="layer" data-layer="forest_cover">
      <h2>Forest cover <small>keys 4 / 5 / 6</small></h2>
      <div class="verdicts"></div>
      <div class="areas"></div>
      <div class="tags"></div>
    </div>
    <div class="layer" data-layer="imagery">
      <h2>Imagery issues</h2>
      <div class="tags"></div>
    </div>
    <textarea id="note" rows="4" placeholder="Optional note"></textarea>
    <p id="status" role="status"></p>
  </aside>
</main>
<script src="/label.js"></script>
</body>
</html>
