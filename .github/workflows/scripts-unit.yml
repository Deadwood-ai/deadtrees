name: Scripts Unit

on:
  pull_request:
    paths:
      - "scripts/**"
      - "shared/**"
      - "deadtrees-cli/**"
      - "docker-compose.*.yaml"
      - "nginx/**"
      - "Makefile"
      - ".env.example"
      - "pytest.ini"
      - ".github/workflows/scripts-unit.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts-unit:
    name: scripts-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: deadtrees-cli/setup.py

      - name: Install DeadTrees CLI and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -e deadtrees-cli

      - name: Validate production and test compose files
        run: |
          cp .env.example .env
          for compose_file in docker-compose.api.yaml docker-compose.processor.yaml docker-compose.test.yaml; do
            echo "Checking ${compose_file}"
            docker compose -f "${compose_file}" config -q
          done

      # Processor auto-deploy, drain, runtime control, asset preflight, backup
      # and operator scripts run unattended on production hosts.
      - name: Test operational scripts
        run: python -m pytest -q scripts/tests

      # test_data_upload.py needs a running API and Supabase; it stays manual.
      - name: Test DeadTrees CLI
        run: python -m pytest -q deadtrees-cli/tests/test_dev_security.py
