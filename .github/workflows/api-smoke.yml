name: API Smoke

on:
  # Heavy suite: run once when a PR opens, and again only when someone adds
  # the full-ci label (remove and re-add it to rerun after later pushes).
  # Every push is already covered by the local review run.
  pull_request:
    types: [opened, reopened, labeled]
    paths:
      - "api/**"
      - "shared/**"
      - "supabase/**"
      - "deadtrees-cli/**"
      - "docker-compose.test.yaml"
      - "nginx/**"
      - "scripts/test-api-smoke.sh"
      - ".github/workflows/api-smoke.yml"

permissions:
  contents: read

concurrency:
  # Other labels get their own group, so labeling a PR never cancels a running suite.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'run' }}
  cancel-in-progress: true

jobs:
  api-smoke:
    name: api-smoke
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: deadtrees-api-smoke
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            deadtrees-cli/setup.py
            api/requirements.txt
            api/requirements-test.txt

      - uses: docker/setup-buildx-action@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.40.7

      - name: Prepare local env
        run: |
          cp .env.example .env
          mkdir -p data/archive data/cogs data/thumbnails data/label_objects data/downloads data/raw_images data/trash
          make setup-local-test-ssh

      - name: Install DeadTrees CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e deadtrees-cli

      - name: Start local Supabase
        run: supabase start

      - name: Run API smoke suite
        run: scripts/test-api-smoke.sh

      - name: Stop API test stack
        if: always()
        run: docker compose -f docker-compose.test.yaml down --remove-orphans

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
