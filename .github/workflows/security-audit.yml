name: Security Audit

# Daily dependency, base-image and workflow audit plus a check of the CISA
# Known Exploited Vulnerabilities list against scripts/security_stack.toml.
# Red means a finding needs a decision; see docs/playbooks/security-audit.md.

on:
  schedule:
    # 23:17 UTC. GitHub starts scheduled runs here up to ~5 h late, so this
    # keeps the result ready for the 07:22 Berlin Claude check.
    - cron: "17 23 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "api/requirements.txt"
      - "processor/requirements.txt"
      - "freidata/requirements.txt"
      - "scripts/requirements-analyst.txt"
      - "labeling-service/requirements.txt"
      - "deadtrees-cli/setup.py"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/security_audit.py"
      - "scripts/security_stack.toml"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read

concurrency:
  # Only PR runs replace each other; scheduled and manual runs all finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  RESULTS: ${{ github.workspace }}/.security-audit
  # Pinned by digest; 0.75.0 was released 2026-10-01.
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  KEV_URL: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

jobs:
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: python -m pip install pip-audit==2.10.1 zizmor==1.30.1 uv==0.12.23

      # Most Python requirements are unpinned, so resolve each file the way a
      # rebuild today would (Python 3.12 on linux x86_64, as in the GDAL image)
      # and audit that exact set. Extra arguments go to uv: a file with a
      # PyTorch --extra-index-url resolves like pip (best match across both
      # indexes). The CUDA tag (+cu126) is dropped before the audit, because
      # PyPI has no record of tagged builds and pip-audit would skip them.
      - name: Audit Python dependencies
        run: |
          mkdir -p "$RESULTS"
          audit() {
            local name="$1" source="$2"
            shift 2
            if uv pip compile --quiet --python-version 3.12 --python-platform x86_64-manylinux_2_28 \
              "$@" "$source" -o "$RUNNER_TEMP/$name.txt"; then
              sed -i -E 's/^([A-Za-z0-9_.-]+==[^ +]+)\+cu[0-9]+/\1/' "$RUNNER_TEMP/$name.txt"
              pip-audit -r "$RUNNER_TEMP/$name.txt" --no-deps --disable-pip --progress-spinner off \
                --format json -o "$RESULTS/pip-$name.json" || true
            fi
            if ! python -c 'import json, sys; json.load(open(sys.argv[1]))' "$RESULTS/pip-$name.json" 2>/dev/null; then
              rm -f "$RESULTS/pip-$name.json"
              echo "python $name" >> "$RESULTS/missing.txt"
            fi
          }
          audit api api/requirements.txt
          audit processor processor/requirements.txt
          audit freidata freidata/requirements.txt
          audit scripts scripts/requirements-analyst.txt
          audit labeling labeling-service/requirements.txt --index-strategy unsafe-best-match
          audit cli deadtrees-cli/setup.py

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --package-lock-only --json > "$RESULTS/npm-frontend.json" || true

      - name: Audit workflows
        run: zizmor --offline --format json .github/workflows > "$RESULTS/zizmor.json" || true

      # Scan the OS layer the API and processor images actually ship: the
      # pinned GDAL base plus the apt upgrade of each Dockerfile's runtime-os
      # stage (DT-1473). PRs skip the GDAL pull.
      - name: Scan image OS packages
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          # The runtime-os stage runs apt-get against the Ubuntu mirrors, which
          # sometimes fail at night (exit 100). Try the build twice and show the
          # tail of the build log when it still fails.
          build_os() {
            local name="$1" log="$RUNNER_TEMP/build-$1.log"
            for attempt in 1 2; do
              if docker build --progress=plain --target runtime-os -t "audit-$name:os" \
                -f "$name/Dockerfile" . > "$log" 2>&1; then
                return 0
              fi
              echo "::warning::$name runtime-os build failed (attempt $attempt); last lines:"
              tail -n 40 "$log"
              [ "$attempt" = 1 ] && sleep 60
            done
            return 1
          }
          for name in api processor; do
            if build_os "$name" \
              && docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RESULTS:/out" \
                "$TRIVY_IMAGE" image --quiet --scanners vuln --pkg-types os --severity HIGH,CRITICAL \
                --format json --output "/out/trivy-$name-image.json" "audit-$name:os"; then
              echo "Scanned $name runtime-os"
            else
              rm -f "$RESULTS/trivy-$name-image.json"
              echo "$name image" >> "$RESULTS/missing.txt"
            fi
          done

      - name: Download CISA KEV catalog
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/kev.json" "$KEV_URL" || true

      - name: Summarize
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--kev "$RUNNER_TEMP/kev.json" --summary "$GITHUB_STEP_SUMMARY" --json "$RESULTS/red.json")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--skip image)
          else
            args+=(--stack-watch)
          fi
          python scripts/security_audit.py "$RESULTS" "${args[@]}"
