name: Frontend Branch Preview

# Agent work branches stay without a PR until "ship it", so the PR preview
# arrives too late for hands-on review. Started by hand only
# (`gh workflow run frontend-hosting-branch-preview.yml --ref <branch>`), never
# on push, because it uses the production deploy credentials. It deploys the
# same Firebase preview channel as PRs (production backend, 7-day expiry) and
# records the URL as a commit status.

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-branch-preview:
    name: frontend-branch-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Compute Firebase preview channel
        id: firebase-channel
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          channel="$(printf 'br-%s' "${BRANCH#claude/}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g' | cut -c1-30)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Deploy to Firebase Hosting preview
        id: firebase-preview
        env:
          VITE_MODE: production
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SAM_API_URL: ${{ secrets.VITE_SAM_API_URL }}
          VITE_POSTHOG_PROJECT_KEY: ${{ secrets.VITE_POSTHOG_PROJECT_KEY }}
          VITE_POSTHOG_API_HOST: ${{ vars.VITE_POSTHOG_API_HOST }}
          VITE_GEOPIFY_KEY: ${{ secrets.VITE_GEOPIFY_KEY }}
          VITE_SUPABASE_SENTINEL_PROCESSING_URL: ${{ secrets.VITE_SUPABASE_SENTINEL_PROCESSING_URL }}
          VITE_SUPABASE_SENTINEL_PROCESSING_ANON_KEY: ${{ secrets.VITE_SUPABASE_SENTINEL_PROCESSING_ANON_KEY }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEADWOOD_D4A4B }}
          FIREBASE_AUTH_MODE: access-token
          FIREBASE_PROJECT_ID: deadwood-d4a4b
          FIREBASE_TOOLS_VERSION: 15.22.2
          FIREBASE_CHANNEL_ID: ${{ steps.firebase-channel.outputs.channel }}
        run: ../.github/scripts/firebase-hosting-deploy.sh preview
      - name: Record preview URL as a commit status
        if: ${{ steps.firebase-preview.outputs.preview_url != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "frontend-branch-preview",
              description: "Firebase preview (production backend)",
              target_url: "${{ steps.firebase-preview.outputs.preview_url }}",
            });
