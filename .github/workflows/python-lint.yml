name: Python Lint

on:
  pull_request:
    paths:
      - "api/**"
      - "shared/**"
      - "processor/**"
      - "deadtrees-cli/**"
      - "freidata/**"
      - "scripts/*.py"
      - "scripts/**/*.py"
      - "scripts/lint-python.sh"
      - "pyproject.toml"
      - ".github/workflows/python-lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python tooling
        run: python -m pip install pytest ruff==0.15.12

      - name: Run critical Python lint
        run: scripts/lint-python.sh --output-format=github

      - name: Test FreiDATA publisher
        run: |
          python -m pip install -r freidata/requirements.txt
          python -m pytest -q freidata/tests
