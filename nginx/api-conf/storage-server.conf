map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=search_embed_per_ip:10m rate=30r/m;
proxy_cache_path /var/lib/nginx/public_file_auth levels=1:2 keys_zone=public_file_auth:10m max_size=64m inactive=10m;

server {
    server_name data2.deadtrees.earth data.deadtrees.earth;

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/live/data2.deadtrees.earth/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/data2.deadtrees.earth/privkey.pem;

    client_max_body_size 10G;

    index =401;
    # root /data;

    location = /api/v1/search/embed {
        rewrite  ^/api/v1/(.*)  /$1 break;
        limit_req zone=search_embed_per_ip burst=10 nodelay;
        proxy_pass http://api:40831;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/datasets/chunk {
        rewrite  ^/api/v1/(.*)  /$1 break;
        proxy_pass http://api:40831;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload chunks can take a long time on slow connections.
        proxy_request_buffering off;
        client_body_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/v1/priwa/warnkarte/(validate|import)$ {
        client_max_body_size 52M;
        rewrite  ^/api/v1/(.*)  /$1 break;
        proxy_pass http://api:40831;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        rewrite  ^/api/v1/(.*)  /$1 break;
        proxy_pass http://api:40831;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Private dataset files and prepared downloads carry bearer tickets in the path;
    # keep them out of access logs, including refused requests.
    location ~ ^/api/v1/(datasets/[0-9]+/files/|exports/) {
        access_log off;
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://api:40831;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File bytes after the API authorized the request with X-Accel-Redirect. The
    # location is internal, so it cannot be requested from outside.
    location ^~ /_protected_data/ {
        internal;
        access_log off;
        alias /data/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Expose-Headers 'Content-Range,Accept-Ranges,Content-Length' always;
    }

    # Static COG and thumbnail URLs serve only the current file of a public or
    # view-only dataset. The answer is cached briefly, so map tiles do not each reach
    # the API; a dataset made private stops being served within a minute.
    location = /_authorize_public_file {
        internal;
        # Preflight and HEAD requests are authorized like GET; the API route only takes GET.
        proxy_method GET;
        proxy_pass http://api:40831/public-files/authorize$request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_cache public_file_auth;
        proxy_cache_key $request_uri;
        proxy_cache_valid 204 403 60s;
    }

    location /cogs/v1/ {
        auth_request /_authorize_public_file;
        alias /data/cogs/;
        autoindex off;
        try_files $uri =404;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type';
    }

    location /thumbnails/v1/ {
        auth_request /_authorize_public_file;
        alias /data/thumbnails/;
        autoindex off;
        try_files $uri =404;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type';
    }

    # Prepared downloads are delivered on signed API links (/api/v1/exports/...).
    location /downloads/v1 {
        return 404;
    }

    location ^~ /assets/v1/prepackaged_datasets_out/ {
        autoindex off;
        return 404;
    }

    location /assets/v1 {
        # set the root for this route
        alias /data/assets;

        # enable indexing
        autoindex on;
        autoindex_exact_size off;
        try_files $uri $uri/ =404;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type';
    }

    location /products/v1 {
        # set the root for this route
        alias /data/products;

        # enable indexing
        autoindex on;
        autoindex_exact_size off;
        try_files $uri $uri/ =404;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type';
    }

    # Block directory listing at root /reference/ level (security - hides UUID list)
    location = /reference/ {
        return 404;
    }

    # Enable directory indexing for paths under /reference/{uuid}/
    # This requires knowing the UUID, but then allows browsing the structure
    location ~ ^/reference/([^/]+)(/.*)?$ {
        # URL: /reference/{uuid}/{dataset_id}/geotiff/...
        # Maps to: /data/reference_export/{uuid}/{dataset_id}/geotiff/...
        # $1 = UUID, $2 = rest of path (including leading /)
        alias /data/reference_export/$1$2;

        # Enable directory indexing once UUID is known
        autoindex on;
        autoindex_exact_size off;
        autoindex_format html;
        
        # CORS
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type';
        
        # Cache control for static files
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name data2.deadtrees.earth data.deadtrees.earth;
    server_tokens off;

    # add ACME challange for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # redirect everything else to the SSL
    location / {
        return 301 https://$server_name/$request_uri;
    }
}
